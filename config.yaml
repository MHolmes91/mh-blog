baseURL: https://mh-blog.ondigitalocean.app/
languageCode: en-us
title: Mark's Notes

build:
  buildStats:
    enable: true
  cachebusters:
    - source: assets/notwatching/hugo_stats\.json
      target: css
    - source: (postcss|tailwind)\.config\.js
      target: css

module:
  imports:
    - path: github.com/MHolmes91/mh-blog-theme
  mounts:
    - source: assets
      target: assets
    - source: hugo_stats.json
      target: assets/notwatching/hugo_stats.json

markup:
  tableOfContents:
    endLevel: 4

privacy:
  x:
    simple: true

outputs:
  home:
    - html
    - rss
    - json

taxonomies:
  tag: tags
  series: series

related:
  includeNewer: true
  threshold: 20
  toLower: true
  indices:
    - name: tags
      weight: 100
    - name: summary
      weight: 70
    - name: date
      weight: 20
      pattern: "200601"

params:
  description: Mark Holmes' personal blog
  siteIcon: /favicon.svg
  intro:
    title: Mark's Notes
    body: Writing on software, systems, and the work behind the work.
  socials:
    - name: GitHub
      url: https://github.com/MHolmes91
      icon: github
