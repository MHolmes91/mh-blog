name: mh-blog
static_sites:
  - name: web
    environment_slug: hugo
    github:
      repo: MHolmes91/mh-blog
      branch: main
      deploy_on_push: true
    source_dir: /
    build_command: npm ci && hugo --gc --minify
    output_dir: public
    index_document: index.html
    error_document: 404.html
ingress:
  rules:
    - component:
        name: web
      match:
        path:
          prefix: /
alerts:
  - rule: DEPLOYMENT_FAILED
  - rule: DOMAIN_FAILED
